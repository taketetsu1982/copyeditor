name: Language rule proposal
description: Propose a change to rules/<lang>.md, with an example that shows the difference.
labels: ["rules"]
body:
  - type: markdown
    attributes:
      value: |
        Rules live in one file per language and are only as good as their examples.
        A proposal needs at least one bad / good / reason triple. If you can, open a pull request
        instead and add the example under `examples/<lang>/`; CI will check it.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - ja (Japanese)
        - en (English)
        - zh (Chinese, Simplified)
        - New language
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Rule section
      description: Every language file has the same headings.
      options:
        - Vocabulary
        - Syntax
        - Structure
        - Translationese
        - Context weighting
        - Not sure
    validations:
      required: true
  - type: textarea
    id: bad
    attributes:
      label: Bad (the sentence as an AI tends to write it)
    validations:
      required: true
  - type: textarea
    id: good
    attributes:
      label: Good (how a fluent writer would put it, same meaning)
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: What makes the bad version unnatural, and what must stay unchanged (numbers, names, negation, strength of the claim).
    validations:
      required: true
  - type: checkboxes
    id: native
    attributes:
      label: Fluency
      options:
        - label: I write this language at a native or professional level.
