name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      COPYEDITOR_BUILD_CACHE_DIR: ${{ runner.temp }}/copyeditor-build-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache@v5
        with:
          path: ${{ env.COPYEDITOR_BUILD_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-copyeditor-buildx-v1-${{ hashFiles('Dockerfile', 'tests/fixtures/Dockerfile.benchmark', 'requirements.generated.txt', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-copyeditor-buildx-v1-${{ hashFiles('Dockerfile', 'tests/fixtures/Dockerfile.benchmark', 'requirements.generated.txt', 'package-lock.json') }}-
      - run: python -m pip install -r requirements.generated.txt
      # The strict suite runs the real image and offline benchmark drivers once.
      - run: python -m pytest tests --require-phase1-contracts --junitxml=phase1.xml --durations=20 -q
