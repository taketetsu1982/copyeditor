name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
concurrency:
  group: copyeditor-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.generated.txt
      - run: python -m pip install -r requirements.generated.txt
      - run: python -m pytest tests -n 4 --dist=loadfile --junitxml=tests.xml -q
      - run: docker build -t copyeditor:test .
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests.xml
          if-no-files-found: warn
          retention-days: 14
