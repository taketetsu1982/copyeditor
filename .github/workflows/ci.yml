name: Tests
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.generated.txt
      # The strict suite runs the real image and offline benchmark drivers once.
      - run: python -m pytest tests --require-phase1-contracts --junitxml=phase1.xml -q
