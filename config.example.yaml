# Example of CTR-04: contracts/config.md#fields
# Set GOOGLE_CLOUD_PROJECT through the runtime environment.
# OAuth secrets and ADC credentials never belong in this file.
provider: vertex
model: gemini-3.1-flash-lite
thinking: low
default_language: ja
protected_terms: []
length_ratio:
  min: 0.5
  max: 2.0
vertex:
  project: ${GOOGLE_CLOUD_PROJECT}
  location: global
auth:
  mode: none
pricing: {}
server:
  host: 0.0.0.0
  port: 8080

# For Google authentication, replace the auth mapping with:
# auth:
#   mode: google
#   base_url: ${BASE_URL}
#   client_id: ${GOOGLE_OAUTH_CLIENT_ID}
#   allowed_domains: ${COPYEDITOR_ALLOWED_DOMAINS}
#   allowed_emails: ${COPYEDITOR_ALLOWED_EMAILS}
# Supply GOOGLE_OAUTH_CLIENT_SECRET and OAUTH_SIGNING_KEY at runtime.

# Optional judgment sends permitted input and candidates to TypeSafe AI.
# Supply TYPESAFE_API_KEY through the runtime secret environment, never this file.
judgment:
  enabled: false
  model: jev-1.13.0
  policy_version: reference-gate-action-v1
  thresholds_version: gate-floor-v1
  timeout_ms: 10000
  polish_deadline_ms: 120000
  rewrite_deadline_ms: 240000
  max_calls: 64
  input_budget: 262144
  pricing: {}
