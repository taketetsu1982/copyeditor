[project]
name = "copyeditor"
version = "0.4.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==4.0.3",
    "google-genai==2.23.0",
    "py-key-value-aio[memory]==0.4.5",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-xdist", "pip-tools"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
